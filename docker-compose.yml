services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  rag:
    build: .
    depends_on:
      - ollama
    env_file:
      - .env
    environment:
      UNSTRUCTURED_DISABLE_NOTICE : "1"
    volumes:
      - ${RAG_DOCUMENTS_DIR:?Set RAG_DOCUMENTS_DIR}:/documents:ro
      - ./data/chroma:/data/chroma
      - ./data/checkpoints:/data/checkpoints

volumes:
  ollama_data:
