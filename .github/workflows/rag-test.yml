name: RAG Pipeline CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RAG_DOCUMENTS_DIR: ${{ github.workspace }}/Research_Docs
      DOCUMENTS_PATH: /documents
      CHROMA_PATH: /tmp/chroma
      COLLECTION_NAME: research
      CHECKPOINT_DB: /tmp/checkpoints.sqlite
      OLLAMA_BASE_URL: http://localhost:11434
      LLM_MODEL: qwen3:8b
      EMBEDDING_MODEL: nomic-embed-text
      GRADER_MODEL: qwen2.5:7b-instruct
      EVALUATOR_MODEL: qwen2.5:7b-instruct
      CHUNK_SIZE: "900"
      CHUNK_OVERLAP: "150"
      TOP_K: "10"
      MAX_K: "100"
      MAX_ATTEMPTS: "2"
      FAITHFULNESS_THRESHOLD: "0.75"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare documents directory
        run: mkdir -p "$RAG_DOCUMENTS_DIR"

      - name: Create CI environment file
        run: |
          cat > .env <<EOF
          RAG_DOCUMENTS_DIR=$RAG_DOCUMENTS_DIR
          DOCUMENTS_PATH=$DOCUMENTS_PATH
          CHROMA_PATH=$CHROMA_PATH
          COLLECTION_NAME=$COLLECTION_NAME
          CHECKPOINT_DB=$CHECKPOINT_DB
          OLLAMA_BASE_URL=$OLLAMA_BASE_URL
          LLM_MODEL=$LLM_MODEL
          EMBEDDING_MODEL=$EMBEDDING_MODEL
          GRADER_MODEL=$GRADER_MODEL
          EVALUATOR_MODEL=$EVALUATOR_MODEL
          CHUNK_SIZE=$CHUNK_SIZE
          CHUNK_OVERLAP=$CHUNK_OVERLAP
          TOP_K=$TOP_K
          MAX_K=$MAX_K
          MAX_ATTEMPTS=$MAX_ATTEMPTS
          FAITHFULNESS_THRESHOLD=$FAITHFULNESS_THRESHOLD
          EOF

      - name: Build and Run Tests
        run: |
          docker compose up -d --build
          docker compose run --rm rag python -m pytest tests/

